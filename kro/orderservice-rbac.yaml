# Bound to the kro capability's access entry group (kro-workloads).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kro:controller:orderservices }
rules:
  - apiGroups: [platform.example.com]
    resources: [orderservices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.example.com]
    resources: [orderservices/status, orderservices/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [sqs.services.k8s.aws]
    resources: [queues]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [dynamodb.services.k8s.aws]
    resources: [tables]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kro-workloads-orderservices }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kro:controller:orderservices }
subjects:
  - { kind: Group, name: kro-workloads, apiGroup: rbac.authorization.k8s.io }
